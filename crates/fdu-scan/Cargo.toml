[package]
name = "fdu-scan"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only filesystem scanning for fdu"

[dependencies]
fdu-core = { path = "../fdu-core" }
crossbeam-deque = "0.8"
foldhash = "0.2"
rustix = { version = "1.1", features = ["fs", "process", "std", "time", "linux_latest"] }

# rustix does not wrap getattrlistbulk or its attribute structures.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rayon = "1.5.1"

[dev-dependencies]
rustix = { version = "1.1", features = ["fs", "mount"] }
