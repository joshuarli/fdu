[package]
name = "fdu"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A disk usage scanner for Linux and macOS"

[workspace]
members = [
    ".",
    "crates/fdu-core",
    "crates/fdu-scan",
    "crates/fdu-delete",
    "crates/fdu-tui",
]
resolver = "2"

[workspace.dependencies]
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher", "inline-more"] }

[features]
allocation-profile = []
default = ["interactive"]
interactive = ["dep:fdu-tui", "dep:fdu-delete"]

[dependencies]
fdu-core = { path = "crates/fdu-core" }
hashbrown = { workspace = true }
fdu-scan = { path = "crates/fdu-scan" }
fdu-delete = { path = "crates/fdu-delete", optional = true }
fdu-tui = { path = "crates/fdu-tui", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["system", "linux_latest"] }

[dev-dependencies]
rustix = { version = "1.1", features = ["fs", "process", "linux_latest"] }
laputa-ptytest = "0.2"
rustybench = "0.2"

[[bench]]
name = "fixture"
harness = false
required-features = ["interactive"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
