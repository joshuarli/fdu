name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Test default build
        run: cargo test --locked

      - name: Test allocation-profile build
        run: cargo test --locked --features allocation-profile

      - name: Build release binary
        run: cargo build --locked --release

      - name: Build allocation-profile release binary
        run: cargo build --locked --release --features allocation-profile
